<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي | صنايعي مطروح</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#061A3D">
  <style>
    :root {
      --sanay3i-navy: #061A3D; --sanay3i-navy-2: #082052; --sanay3i-navy-3: #0B2A66;
      --blue: #1d4ed8; --gold: #f59e0b; --danger: #dc2626; --green: #16a34a; --purple: #7c3aed;
      --muted: #64748b; --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; color: #0f172a; overflow-x: hidden;
      display: flex; flex-direction: column; align-items: center;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(245, 158, 11, 0.12), transparent 30%),
        linear-gradient(135deg, #f8fafc 0%, #eef6ff 100%);
    }

    .site-header {
      width: 100%; position: sticky; top: 0; z-index: 10;
      background: linear-gradient(135deg, var(--sanay3i-navy), var(--sanay3i-navy-2) 55%, var(--sanay3i-navy-3));
      box-shadow: 0 18px 45px rgba(2,6,23,.20);
    }
    .header-content {
      max-width: 1180px; margin: auto; width: calc(100% - 30px);
      min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
    .brand-logo-frame {
      width: 50px; height: 50px; flex: none; border-radius: 17px; padding: 4px;
      background: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.22); overflow: hidden;
    }
    .brand-logo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; display: block; }
    .brand-text h1 { margin: 0; font-size: 19px; font-weight: 900; color: #fff; line-height: 1.2; }
    .brand-text span { display: block; color: rgba(226,232,240,.8); font-size: 11.5px; font-weight: 800; margin-top: 3px; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .header-btn-ghost, .logout-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff;
      padding: 9px 16px; border-radius: 999px; font-family: inherit; font-weight: 800; font-size: 12.5px;
      cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap;
    }
    .header-btn-ghost:hover, .logout-btn:hover { background: rgba(255,255,255,0.18); }

    main { flex: 1; width: 100%; max-width: 760px; padding: 30px 16px 60px; }

    .page-title-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
    .page-title { text-align: center; font-size: 22px; font-weight: 900; margin: 0; }
    .refresh-btn {
      background: #fff; border: 1px solid var(--border); color: var(--sanay3i-navy);
      padding: 8px 16px; border-radius: 999px; font-family: inherit; font-weight: 800; font-size: 12.5px;
      cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 16px rgba(15,23,42,0.06);
    }
    .refresh-btn:hover { border-color: var(--blue); color: var(--blue); }
    .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .page-subtitle { text-align: center; font-size: 13.5px; color: var(--muted); font-weight: 700; margin: 0 0 24px; }

    .login-required {
      background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 36px 24px;
      text-align: center; box-shadow: 0 20px 50px rgba(15,23,42,0.08);
    }
    .login-required i { font-size: 30px; color: var(--blue); margin-bottom: 12px; }
    .login-required p { color: var(--muted); font-weight: 700; margin: 10px 0 18px; }
    .login-required a {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      background: linear-gradient(135deg, var(--sanay3i-navy), var(--sanay3i-navy-2));
      color: #fff; padding: 12px 26px; border-radius: 999px; font-weight: 900; font-size: 14px;
    }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-weight: 700; }
    .empty-state i { font-size: 34px; margin-bottom: 12px; display: block; color: #cbd5e1; }

    .request-card {
      background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 20px;
      margin-bottom: 16px; box-shadow: 0 14px 34px rgba(15,23,42,0.06); overflow: hidden;
    }
    .request-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .request-worker { font-weight: 900; font-size: 15.5px; color: #0f172a; }
    .request-worker span { display: block; font-weight: 700; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .request-id { font-size: 11.5px; color: var(--muted); font-weight: 800; margin-top: 4px; }

    .status-badge { padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 900; white-space: nowrap; flex: none; }
    .status-new { background: #e0f2fe; color: #0369a1; }
    .status-accepted { background: #dcfce7; color: #15803d; }
    .status-in_progress { background: #fef3c7; color: #b45309; }
    .status-completed { background: #ede9fe; color: #6d28d9; }
    .status-rejected { background: #fee2e2; color: #b91c1c; }
    .status-cancelled { background: #f1f5f9; color: #475569; }

    .request-desc { font-size: 13.5px; color: #334155; font-weight: 600; line-height: 1.8; margin: 8px 0; word-break: break-word; }
    .request-meta { font-size: 12px; color: var(--muted); font-weight: 700; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .request-meta span i { margin-left: 4px; }
    .rejected-reason { margin-top: 10px; font-size: 12.5px; color: var(--danger); font-weight: 700; background: #fef2f2; padding: 8px 12px; border-radius: 12px; word-break: break-word; }

    .loading { text-align: center; padding: 40px; color: var(--muted); font-weight: 700; }

    .rate-btn {
      margin-top: 12px; background: linear-gradient(135deg, var(--gold), #fbbf24); color: #fff; border: none;
      padding: 10px 18px; border-radius: 999px; font-family: inherit; font-weight: 900; font-size: 12.5px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .rate-btn:hover { transform: translateY(-1px); }
    .review-done-badge { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 800; font-size: 12.5px; }

    .review-modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 4200;
      display: none; align-items: center; justify-content: center; padding: 18px;
    }
    .review-modal-overlay.show { display: flex; }
    .review-modal-box { width: min(440px, 100%); background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 25px 65px rgba(15,23,42,0.3); }
    .review-modal-box h3 { margin: 0 0 6px; color: #0f172a; }
    .review-modal-box p { color: var(--muted); font-weight: 700; margin: 0 0 16px; font-size: 13px; }
    .review-modal-box select, .review-modal-box textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
      margin-bottom: 10px; font-family: inherit; font-weight: 700; outline: none; box-sizing: border-box;
    }
    .review-modal-box textarea { min-height: 90px; resize: vertical; }
    .review-modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .review-modal-actions button { flex: 1; min-height: 44px; border: 0; border-radius: 14px; font-weight: 900; cursor: pointer; }
    .review-submit-btn { background: var(--sanay3i-navy); color: #fff; }
    .review-cancel-btn { background: #f1f5f9; color: var(--sanay3i-navy); }
    .review-modal-message { display: none; margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-weight: 800; font-size: 13px; }
    .review-modal-message.success { display: block; background: #dcfce7; color: #166534; }
    .review-modal-message.error { display: block; background: #fee2e2; color: #991b1b; }

    @media (max-width: 400px) {
      .header-content { justify-content: center; }
      .brand-text h1 { font-size: 17px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-content">
      <a href="/" class="brand">
        <div class="brand-logo-frame">
          <img src="/icons/icon-192.png" alt="">
        </div>
        <div class="brand-text">
          <h1>صنايعي مطروح</h1>
          <span>دليل موثوق لصنايعية مرسى مطروح</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="/" class="header-btn-ghost"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <button class="logout-btn" id="logoutBtn" style="display:none">
          <i class="fa-solid fa-right-from-bracket"></i> خروج
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-title-row">
      <h2 class="page-title">طلباتي</h2>
      <button class="refresh-btn" id="refreshBtn" style="display:none">
        <i class="fa-solid fa-rotate"></i> تحديث
      </button>
    </div>
    <p class="page-subtitle">متابعة طلبات الخدمة اللي بعتّها للصنايعية</p>

    <div id="content">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</div>
    </div>
  </main>

  <div class="review-modal-overlay" id="reviewModal">
    <div class="review-modal-box">
      <h3><i class="fa-solid fa-star"></i> قيّم الصنايعي</h3>
      <p id="reviewModalWorkerName"></p>
      <form id="reviewForm">
        <select id="reviewRatingInput" required>
          <option value="">اختر التقييم</option>
          <option value="5">5 نجوم - ممتاز</option>
          <option value="4">4 نجوم - جيد جدًا</option>
          <option value="3">3 نجوم - جيد</option>
          <option value="2">2 نجوم - مقبول</option>
          <option value="1">1 نجمة - ضعيف</option>
        </select>
        <textarea id="reviewCommentInput" maxlength="1000" placeholder="تعليقك (اختياري)..."></textarea>
        <div class="review-modal-actions">
          <button type="submit" class="review-submit-btn" id="reviewSubmitBtn">إرسال التقييم</button>
          <button type="button" class="review-cancel-btn" id="reviewCancelBtn">إلغاء</button>
        </div>
        <div class="review-modal-message" id="reviewModalMessage"></div>
      </form>
    </div>
  </div>

  <script>
    const STATUS_LABELS = {
      new: 'جديد', accepted: 'تم القبول', in_progress: 'جاري التنفيذ',
      completed: 'مكتمل', rejected: 'مرفوض', cancelled: 'ملغي'
    };
    const ACTIVE_STATUSES = ['new', 'accepted', 'in_progress'];
    const POLL_INTERVAL_MS = 30000;

    const content = document.getElementById('content');
    const logoutBtn = document.getElementById('logoutBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    let pollTimer = null;

    function getCustomerToken() {
      return localStorage.getItem('sanay3i_customer_token') || '';
    }

    function clearCustomerSession() {
      localStorage.removeItem('sanay3i_customer_token');
      localStorage.removeItem('sanay3i_customer_id');
      localStorage.removeItem('sanay3i_customer_name');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function formatDate(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (e) { return ''; }
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function schedulePolling(requests) {
      stopPolling();
      const hasActive = (requests || []).some(r => ACTIVE_STATUSES.includes(r.status));
      if (!hasActive) return;
      pollTimer = setInterval(() => {
        if (document.hidden) return; // منوقفش خالص، بس منجيبش بيانات وإحنا مش شايفين الصفحة
        loadRequests({ silent: true });
      }, POLL_INTERVAL_MS);
    }

    function renderLoginRequired(reason) {
      stopPolling();
      logoutBtn.style.display = 'none';
      refreshBtn.style.display = 'none';
      content.innerHTML = `
        <div class="login-required">
          <i class="fa-solid fa-lock"></i>
          <h3>${reason === 'expired' ? 'انتهت جلستك' : 'سجّل دخولك الأول'}</h3>
          <p>${reason === 'expired' ? 'يرجى تسجيل الدخول تاني عشان تقدر تشوف طلباتك' : 'لازم تسجّل دخول كعميل عشان تقدر تشوف طلباتك'}</p>
          <a href="/customer-auth?redirect=/my-requests"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</a>
        </div>`;
    }

    function renderEmpty() {
      content.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-inbox"></i>
          لسه معملتش أي طلب خدمة.<br>هتلاقي زرار "اطلب خدمة" في صفحة أي صنايعي.
        </div>`;
    }

    function renderRequests(requests) {
      content.innerHTML = requests.map(r => {
        const statusClass = 'status-' + (r.status || 'new');
        const statusLabel = STATUS_LABELS[r.status] || r.status;
        const rejectedBlock = (r.status === 'rejected' && r.rejected_reason)
          ? `<div class="rejected-reason"><i class="fa-solid fa-circle-exclamation"></i> ${escapeHtml(r.rejected_reason)}</div>`
          : '';
        let reviewBlock = '';
        if (r.status === 'completed') {
          reviewBlock = r.has_review
            ? `<div class="review-done-badge"><i class="fa-solid fa-circle-check"></i> تم إرسال تقييمك</div>`
            : `<button type="button" class="rate-btn" data-request-id="${escapeHtml(r.id)}" data-worker-name="${escapeHtml(r.worker_name || 'الصنايعي')}"><i class="fa-solid fa-star"></i> قيّم الصنايعي</button>`;
        }
        return `
          <div class="request-card">
            <div class="request-top">
              <div class="request-worker">
                ${escapeHtml(r.worker_name || 'صنايعي')}
                <span>${escapeHtml(r.worker_trade || '')}${r.worker_area ? ' - ' + escapeHtml(r.worker_area) : ''}</span>
                <span class="request-id">طلب رقم #${escapeHtml(r.id)}</span>
              </div>
              <span class="status-badge ${statusClass}">${escapeHtml(statusLabel)}</span>
            </div>
            <div class="request-desc">${escapeHtml(r.description)}</div>
            ${rejectedBlock}
            <div class="request-meta">
              <span><i class="fa-regular fa-calendar"></i> ${formatDate(r.created_at)}</span>
            </div>
            ${reviewBlock}
          </div>`;
      }).join('');
    }

    async function loadRequests(opts) {
      const silent = !!(opts && opts.silent);
      const token = getCustomerToken();
      if (!token) { renderLoginRequired(); return; }

      logoutBtn.style.display = 'flex';
      refreshBtn.style.display = 'flex';
      if (!silent) refreshBtn.disabled = true;

      try {
        const r = await fetch('/api/service-requests/mine', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (r.status === 401) {
          clearCustomerSession();
          renderLoginRequired('expired');
          return;
        }

        const d = await r.json();
        if (!r.ok || !d.success) throw new Error(d.error || 'تعذر تحميل الطلبات');

        if (!d.requests || !d.requests.length) {
          renderEmpty();
        } else {
          renderRequests(d.requests);
        }
        schedulePolling(d.requests);
      } catch (err) {
        if (!silent) {
          content.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(err.message)}</div>`;
        }
      } finally {
        refreshBtn.disabled = false;
      }
    }

    logoutBtn.addEventListener('click', () => {
      clearCustomerSession();
      stopPolling();
      window.location.href = '/customer-auth';
    });

    refreshBtn.addEventListener('click', () => loadRequests());

    window.addEventListener('pagehide', stopPolling);
    window.addEventListener('beforeunload', stopPolling);

    // ===============================
    // تقييم طلب مكتمل
    // ===============================
    const reviewModal = document.getElementById('reviewModal');
    const reviewForm = document.getElementById('reviewForm');
    const reviewModalMessage = document.getElementById('reviewModalMessage');
    let activeReviewRequestId = null;

    function showReviewMessage(type, text) {
      reviewModalMessage.className = 'review-modal-message ' + (type || '');
      reviewModalMessage.textContent = text || '';
    }

    function openReviewModal(requestId, workerName) {
      activeReviewRequestId = requestId;
      document.getElementById('reviewModalWorkerName').textContent = 'قيّم تجربتك مع: ' + workerName;
      reviewForm.reset();
      showReviewMessage('', '');
      reviewModal.classList.add('show');
    }

    function closeReviewModal() {
      reviewModal.classList.remove('show');
      activeReviewRequestId = null;
    }

    // تفويض النقر بدل onclick مباشر عشان اسم الصنايعي ميكسرش الـ HTML لو فيه علامات اقتباس
    content.addEventListener('click', (e) => {
      const btn = e.target.closest('.rate-btn');
      if (!btn) return;
      openReviewModal(btn.dataset.requestId, btn.dataset.workerName || 'الصنايعي');
    });

    document.getElementById('reviewCancelBtn').addEventListener('click', closeReviewModal);
    reviewModal.addEventListener('click', (e) => { if (e.target === reviewModal) closeReviewModal(); });

    reviewForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeReviewRequestId) return;

      const rating = Number(document.getElementById('reviewRatingInput').value);
      const comment = document.getElementById('reviewCommentInput').value.trim();
      if (!rating) return showReviewMessage('error', 'يرجى اختيار التقييم');

      const token = getCustomerToken();
      if (!token) { closeReviewModal(); renderLoginRequired('expired'); return; }

      const btn = document.getElementById('reviewSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';
      showReviewMessage('', '');

      try {
        const r = await fetch('/api/service-requests/' + activeReviewRequestId + '/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ rating, comment })
        });
        const d = await r.json().catch(() => ({}));

        if (r.status === 401) {
          clearCustomerSession();
          closeReviewModal();
          renderLoginRequired('expired');
          return;
        }
        if (!r.ok || !d.success) throw new Error(d.error || 'تعذر إرسال التقييم');

        showReviewMessage('success', 'تم إرسال تقييمك');
        setTimeout(() => {
          closeReviewModal();
          loadRequests(); // نجيب الحالة الحقيقية من السيرفر عشان زرار التقييم يختفي ويظهر بدله علامة "تم التقييم"
        }, 900);
      } catch (err) {
        showReviewMessage('error', err.message || 'تعذر إرسال التقييم');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'إرسال التقييم';
      }
    });

    loadRequests();
  </script>
</body>
</html>
