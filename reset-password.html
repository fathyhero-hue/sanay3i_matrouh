<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور | صنايعي مطروح</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .header { width: 100%; background: #061A3D; padding: 15px 20px; text-align: center; position: absolute; top: 0; }
    .header h1 { color: #fff; margin: 0; font-size: 22px; }
    .login-wrapper { max-width: 400px; width: 90%; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 80px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #334155; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 15px; box-sizing: border-box; }
    .btn-main { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 15px; margin-bottom: 10px; }
    .btn-main:hover { background: #0369a1; }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-msg { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
    .status-msg.error { color: #dc2626; }
    .status-msg.success { color: #16a34a; }
  </style>
</head>
<body>
  <div class="header"><h1><i class="fa-solid fa-screwdriver-wrench"></i> صنايعي مطروح</h1></div>
  <div class="login-wrapper">
    <h2 style="text-align:center;margin-bottom:20px;color:#0f172a;"><i class="fa-solid fa-key"></i> إعادة تعيين كلمة المرور</h2>
    <form id="resetForm">
      <div class="form-group">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="passwordInput" required minlength="6" placeholder="6 أحرف على الأقل">
      </div>
      <div class="form-group">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirmInput" required minlength="6" placeholder="أعد كتابة كلمة المرور">
      </div>
      <button type="submit" class="btn-main" id="resetBtn">تحديث كلمة المرور</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const statusMsg = document.getElementById('statusMsg');
    const resetBtn = document.getElementById('resetBtn');
    function showStatus(type, msg) {
      statusMsg.className = 'status-msg ' + type;
      statusMsg.textContent = msg;
    }
    if (!token) showStatus('error', 'الرابط غير صالح. يرجى طلب رابط جديد من صفحة تسجيل الدخول.');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('passwordInput').value.trim();
      const confirm = document.getElementById('confirmInput').value.trim();
      if (!token) return showStatus('error', 'الرابط غير صالح.');
      if (password.length < 6) return showStatus('error', 'كلمة المرور يجب ألا تقل عن 6 أحرف.');
      if (password !== confirm) return showStatus('error', 'كلمتا المرور غير متطابقتين.');

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحديث...';
      try {
        const r = await fetch('/api/worker/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const d = await r.json();
        if (!r.ok || !d.success) throw new Error(d.error || 'حدث خطأ غير متوقع');
        showStatus('success', 'تم تحديث كلمة المرور بنجاح! جاري تحويلك لصفحة الدخول...');
        setTimeout(() => { window.location.href = '/worker-login'; }, 1500);
      } catch (err) {
        showStatus('error', err.message);
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = 'تحديث كلمة المرور';
      }
    });
  </script>
</body>
</html>
