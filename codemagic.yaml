workflows:
  ios-sanay3i-matrouh:
    name: Sanay3i Matrouh - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    # المفتاح "codemagic" ده نفس مفتاح Apple Developer Portal API المربوط بالفعل
    # في Settings > Integrations > Developer Portal (Key: 6842LF2WQN) - نفس المفتاح
    # المستخدم في تطبيقات تانية، معاد استخدامه هنا بدل ما نعمل مفتاح جديد.
    # لسه لازم قبل أول build:
    # 1) سجّل الـ Bundle ID ده في developer.apple.com > Identifiers
    # 2) أنشئ سجل تطبيق بنفس الـ Bundle ID في App Store Connect
    # 3) فعّل Automatic code signing لل workflow ده تحديدًا من صفحة الـ workflow نفسها في Codemagic
    integrations:
      app_store_connect: codemagic

    environment:
      # ملحوظة: قصدًا من غير قسم ios_signing هنا - وجوده كان بيخلي Codemagic يحاول
      # يجهز التوقيع تلقائيًا في مرحلة مبكرة قبل حتى ما تبدأ خطوات scripts تحت،
      # والمرحلة التلقائية دي كانت بتفشل (No matching profiles found) من غير ما
      # توصل فرصة لسكريبتاتنا اللي بتعمل fetch-signing-files --create. دلوقتي
      # سكريبتاتنا هي المسؤولة بالكامل عن التوقيع.
      vars:
        XCODE_PROJECT: "ios-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sanay3imatrouh.app"
      xcode: latest
      node: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: تثبيت اعتماديات مشروع الـ iOS ومزامنة Capacitor
        script: |
          cd ios-app
          npm install
          npx cap sync ios

      - name: إنشاء أو جلب شهادة وبروفايل التوقيع من App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: تطبيق بروفايلات التوقيع على مشروع Xcode
        script: |
          xcode-project use-profiles

      - name: ترقيم البناء تلقائيًا (build number) عشان كل رفعة تاخد رقم جديد
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          cd "$CM_BUILD_DIR/ios-app/ios/App"
          agvtool new-version -all $((LATEST + 1))

      - name: بناء الـ IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # يرفع أول ما البناء ينجح على TestFlight تلقائيًا (مراجعة داخلية بس، مش نشر عام).
        submit_to_testflight: true
        # سيبها false لحد ما تتأكد من كل حاجة على TestFlight وتكون جاهز فعليًا تقدّم للمراجعة العامة.
        submit_to_app_store: false
