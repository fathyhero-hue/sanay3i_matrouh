workflows:
  ios-sanay3i-matrouh:
    name: Sanay3i Matrouh - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    # المفتاح "codemagic" ده نفس مفتاح Apple Developer Portal API المربوط بالفعل
    # في Settings > Integrations > Developer Portal (Key: 6842LF2WQN) - بيُستخدم
    # هنا بس عشان خطوة رفع البناء لـ TestFlight (publishing) في آخر الملف.
    #
    # التوقيع نفسه (certificate + provisioning profile) بقى يدوي بالكامل ومرفوع
    # مباشرة في Codemagic (Team Settings > Code signing identities)، مش عن طريق
    # fetch-signing-files التلقائي - لأن حساب أبل فيه شهادات قديمة (من تطبيقات
    # تانية) معندناش مفاتيحها الخاصة، وأي محاولة مزامنة تلقائية مع كل شهادات
    # الحساب كانت بتفشل بسببها. الشهادة والبروفايل الحاليين اتعملوا بمفتاح خاص
    # معروف من الأول وترفعوا يدويًا، فمفيش داعي لأي مزامنة API خالص.
    integrations:
      app_store_connect: codemagic

    environment:
      # ملحوظة: قصدًا من غير قسم ios_signing (الحقل الخاص بالتوقيع التلقائي عبر
      # API أبل) هنا - وجوده كان بيخلي Codemagic يحاول يجهز التوقيع تلقائيًا في
      # مرحلة مبكرة قبل حتى ما تبدأ خطوات scripts تحت، والمرحلة التلقائية دي
      # كانت بتفشل (No matching profiles found) بسبب شهادات قديمة في حساب أبل
      # معندناش مفاتيحها الخاصة. التوقيع دلوقتي بيتم يدويًا بالكامل عن طريق
      # متغيرات البيئة CM_CERTIFICATE / CM_CERTIFICATE_PASSWORD /
      # CM_PROVISIONING_PROFILE (مجموعة ios_signing) اللي بيتم فك تشفيرها
      # (base64) وتحميلها يدويًا في خطوات scripts تحت.
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sanay3imatrouh.app"
      xcode: latest
      node: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: تثبيت اعتماديات مشروع الـ iOS ومزامنة Capacitor
        script: |
          cd ios-app
          npm install
          npx cap sync ios

      - name: فك تشفير الشهادة والبروفايل من متغيرات البيئة وإضافتهم للبناء
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision

          keychain initialize
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD

          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          cp /tmp/profile.mobileprovision "$PROFILES_HOME/$(uuidgen).mobileprovision"

      - name: تطبيق بروفايل التوقيع على مشروع Xcode
        script: |
          xcode-project use-profiles

      - name: ترقيم البناء تلقائيًا (build number) عشان كل رفعة تاخد رقم جديد
        script: |
          # وقت البناء الحالي (Unix timestamp) كرقم بناء - دايمًا فريد ودايمًا
          # بيزيد، من غير ما نعتمد على سؤال App Store Connect عن آخر رقم (كان
          # بيرجع قيم قديمة/مكررة أحيانًا وبيسبب فشل الرفع).
          cd "$CM_BUILD_DIR/ios-app/ios/App"
          agvtool new-version -all $(date +%s)

      - name: أرشفة تشخيصية مباشرة عبر xcodebuild لإظهار الخطأ الحقيقي عند فشل Archive
        script: |
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath /tmp/Sanay3iDiagnostic.xcarchive \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=HEEQRGYJ64 \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | tee /tmp/xcodebuild_logs/archive.log

          ARCHIVE_STATUS=$?
          if [ $ARCHIVE_STATUS -ne 0 ]; then
            echo "----- أول 40 سطر من الخطأ الحقيقي في archive.log -----"
            grep -E "error:|CodeSign|Provisioning|profile|entitlement|SwiftCompile|SwiftEmitModule|Package|dependency|CapacitorPushNotifications" /tmp/xcodebuild_logs/archive.log | head -40
            exit $ARCHIVE_STATUS
          fi

          echo "DIAGNOSTIC ARCHIVE SUCCESS"

      - name: بناء الـ IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # يرفع أول ما البناء ينجح على TestFlight تلقائيًا (مراجعة داخلية بس، مش نشر عام).
        submit_to_testflight: true
        # سيبها false لحد ما تتأكد من كل حاجة على TestFlight وتكون جاهز فعليًا تقدّم للمراجعة العامة.
        submit_to_app_store: false
