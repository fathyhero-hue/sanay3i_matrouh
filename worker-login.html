<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الصنايعي | صنايعي مطروح</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#061A3D">
  <style>
    :root {
      --sanay3i-navy: #061A3D; --sanay3i-navy-2: #082052; --sanay3i-navy-3: #0B2A66;
      --blue: #1d4ed8; --gold: #f59e0b; --danger: #dc2626; --green: #16a34a;
      --muted: #64748b; --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; color: #0f172a;
      display: flex; flex-direction: column; align-items: center;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(245, 158, 11, 0.12), transparent 30%),
        linear-gradient(135deg, #f8fafc 0%, #eef6ff 100%);
    }

    .site-header {
      width: 100%; position: sticky; top: 0; z-index: 10;
      background: linear-gradient(135deg, var(--sanay3i-navy), var(--sanay3i-navy-2) 55%, var(--sanay3i-navy-3));
      box-shadow: 0 18px 45px rgba(2,6,23,.20);
    }
    .header-content {
      max-width: 1180px; margin: auto; width: calc(100% - 30px);
      min-height: 78px; display: flex; align-items: center; justify-content: center; gap: 13px;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-logo-frame {
      width: 50px; height: 50px; border-radius: 17px; padding: 4px;
      background: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.22); overflow: hidden;
    }
    .brand-logo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; display: block; }
    .brand-text h1 { margin: 0; font-size: 19px; font-weight: 900; color: #fff; line-height: 1.2; }
    .brand-text span { display: block; color: rgba(226,232,240,.8); font-size: 11.5px; font-weight: 800; margin-top: 3px; }

    main {
      flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
      padding: 36px 16px;
    }

    .login-card {
      width: 100%; max-width: 420px; background: rgba(255,255,255,0.96);
      border: 1px solid rgba(226,232,240,0.9); border-radius: 28px;
      padding: 34px 28px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }

    .login-icon {
      width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 20px;
      background: linear-gradient(135deg, var(--sanay3i-navy), var(--blue));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 24px; box-shadow: 0 14px 28px rgba(6, 26, 61, 0.28);
    }

    .login-title { text-align: center; margin: 0 0 6px; font-size: 22px; font-weight: 900; color: #0f172a; }
    .login-subtitle { text-align: center; margin: 0 0 26px; font-size: 13.5px; color: var(--muted); font-weight: 700; line-height: 1.7; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 7px; font-weight: 800; font-size: 13.5px; color: #334155; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; top: 50%; right: 16px; transform: translateY(-50%); color: var(--blue); font-size: 15px; }
    .input-wrap input {
      width: 100%; padding: 13px 44px 13px 14px; border: 1px solid var(--border); border-radius: 14px;
      font-family: inherit; font-size: 14.5px; background: #f8fafc; outline: none;
      transition: 0.2s ease; box-sizing: border-box;
    }
    .input-wrap input:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(29,78,216,0.10); }

    .btn-main {
      width: 100%; padding: 14px; margin-top: 6px;
      background: linear-gradient(135deg, var(--sanay3i-navy), var(--sanay3i-navy-2));
      color: #fff; border: none; border-radius: 999px; font-weight: 900; font-size: 15px;
      cursor: pointer; font-family: inherit; transition: 0.25s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 14px 26px rgba(6, 26, 61, 0.24);
    }
    .btn-main:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 18px 30px rgba(6, 26, 61, 0.3); }
    .btn-main:disabled { opacity: 0.65; cursor: not-allowed; }

    .forgot-link {
      display: block; text-align: center; margin-top: 16px; background: none; border: none;
      color: var(--blue); font-family: inherit; font-size: 13.5px; font-weight: 800;
      cursor: pointer; width: 100%; padding: 6px;
    }
    .forgot-link:hover { color: var(--sanay3i-navy); text-decoration: underline; }
    .forgot-link:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-msg { margin-top: 16px; font-size: 13.5px; text-align: center; font-weight: 800; line-height: 1.7; min-height: 0; }
    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--green); }

    .back-home { display: block; text-align: center; margin-top: 22px; color: var(--muted); font-size: 13px; font-weight: 800; text-decoration: none; }
    .back-home:hover { color: var(--sanay3i-navy); }
    .back-home i { margin-left: 5px; }

    @media (max-width: 460px) {
      .login-card { padding: 28px 20px; border-radius: 24px; }
      main { padding: 24px 14px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-content">
      <a href="/" class="brand">
        <div class="brand-logo-frame">
          <img src="/icons/icon-192.png" alt="">
        </div>
        <div class="brand-text">
          <h1>صنايعي مطروح</h1>
          <span>دليل موثوق لصنايعية مرسى مطروح</span>
        </div>
      </a>
    </div>
  </header>

  <main>
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-user-gear"></i></div>
      <h2 class="login-title">حسابي</h2>
      <p class="login-subtitle">سجّل دخولك لإدارة بروفايلك، صور شغلك، ومراسلة الإدارة</p>

      <form id="loginForm">
        <div class="form-group">
          <label>رقم التليفون أو البريد الإلكتروني</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="phoneInput" required placeholder="أدخل رقم تليفونك أو بريدك الإلكتروني المسجل">
          </div>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
          </div>
        </div>
        <button type="submit" class="btn-main" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i>
          دخول للوحة التحكم
        </button>
        <button type="button" class="forgot-link" id="forgotBtn">
          <i class="fa-solid fa-key"></i> نسيت كلمة المرور؟
        </button>
        <div id="statusMsg" class="status-msg"></div>
      </form>

      <a href="/" class="back-home"><i class="fa-solid fa-arrow-right"></i>رجوع لدليل الصنايعية</a>
    </div>
  </main>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const forgotBtn = document.getElementById('forgotBtn');
    const phoneInput = document.getElementById('phoneInput');
    const passwordInput = document.getElementById('passwordInput');
    const statusMsg = document.getElementById('statusMsg');

    function showStatus(type, msg) {
      statusMsg.className = 'status-msg ' + type;
      statusMsg.textContent = msg;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = phoneInput.value.trim();
      const password = passwordInput.value.trim();

      if (!identifier || !password) return showStatus('error', 'يرجى إدخال البيانات المطلوبة');

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول...';

      try {
        const r = await fetch('/api/worker/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const d = await r.json();
        if (!r.ok || !d.success) throw new Error(d.error || 'خطأ في تسجيل الدخول');

        // حفظ التوكن وبيانات الجلسة عشان لوحة التحكم تفتح مباشر
        localStorage.setItem("sanay3i_owner_chat_token_" + d.worker.id, d.worker.id);
        localStorage.setItem("sanay3i_current_worker_id", d.worker.id);
        localStorage.setItem("sanay3i_worker_token", d.token);

        showStatus('success', 'تم تسجيل الدخول! جاري توجيهك للوحة التحكم...');

        // التوجيه المباشر لصفحة التعديلات ولوحة التحكم بدلاً من البروفايل العام
        setTimeout(() => { window.location.href = '/worker-dashboard?id=' + d.worker.id; }, 1200);
      } catch(err) {
        showStatus('error', err.message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول للوحة التحكم';
      }
    });

    // الزر الآمن الجديد الذي يرسل الواتساب ولا يعرض كلمة السر
    forgotBtn.addEventListener('click', async () => {
      const identifier = phoneInput.value.trim();
      if (!identifier) return showStatus('error', 'يرجى إدخال رقم التليفون أو البريد الإلكتروني أولاً في الخانة بالأعلى');

      forgotBtn.disabled = true;
      forgotBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال كلمة السر...';

      try {
        const r = await fetch('/api/worker/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier })
        });
        const d = await r.json();

        if (!r.ok || !d.success) throw new Error(d.error || 'حدث خطأ غير متوقع');

        // إفراغ خانة الباسوورد (كإجراء أمني إضافي)
        passwordInput.value = '';

        // إظهار رسالة النجاح (النص جاي من رد السيرفر نفسه - بقى عن رابط بالإيميل)
        showStatus('success', d.message || 'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.');
      } catch(err) {
        showStatus('error', err.message);
      } finally {
        forgotBtn.disabled = false;
        forgotBtn.innerHTML = '<i class="fa-solid fa-key"></i> نسيت كلمة المرور؟';
      }
    });
  </script>
</body>
</html>
